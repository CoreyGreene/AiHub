<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16161d">
  <title>MovieAi</title>
  <link rel="icon" href="data:,">
  <!-- Shown instead of the site while the code lock is on (server/lock.py).
       Everything is in this one file: nothing else can load until the
       code is typed. -->
  <style>
    :root {
      --bg: #16161d;
      --card: #20202a;
      --line: #34343f;
      --text: #ececf1;
      --muted: #9a9aa8;
      --accent: #7c6cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 16px;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    form {
      width: min(100%, 360px);
      display: grid;
      gap: 14px;
      padding: 24px 20px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    h1 { margin: 0; font-size: 1.4rem; }
    p { margin: 0; color: var(--muted); }
    input {
      width: 100%;
      min-height: 60px;
      padding: 0 12px;
      font: inherit;
      font-size: 1.8rem;
      letter-spacing: 0.5em;
      text-indent: 0.5em; /* keeps the digits centred with the spacing */
      text-align: center;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button {
      min-height: 52px;
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #error { min-height: 1.5em; color: #ff9b9b; }
  </style>
</head>
<body>
  <form id="unlock" novalidate>
    <h1>MovieAi</h1>
    <p>Type the six-digit code to get in.</p>
    <input id="code" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6"
           autocomplete="one-time-code" aria-label="Code" autofocus>
    <p id="error" role="alert"></p>
    <button id="go" type="submit">Open</button>
  </form>
  <script>
    const form = document.getElementById("unlock");
    const input = document.getElementById("code");
    const error = document.getElementById("error");
    const go = document.getElementById("go");

    async function send() {
      const code = input.value.replace(/\D/g, "");
      if (code.length !== 6) {
        error.textContent = "The code has six digits.";
        return;
      }
      go.disabled = true;
      error.textContent = "";
      try {
        const res = await fetch("api/unlock", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code }),
        });
        const data = await res.json();
        if (data.open) {
          location.reload(); // the site itself now
          return;
        }
        error.textContent = data.message || "That didn't work. Try again.";
      } catch {
        error.textContent = "Couldn't reach the server.";
      }
      input.value = "";
      input.focus();
      go.disabled = false;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      send();
    });
    // Digits only; the sixth one opens it without pressing the button.
    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "").slice(0, 6);
      if (input.value.length === 6 && !go.disabled) send();
    });
  </script>
</body>
</html>
