<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16161d">
  <title>ImageAi</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <h1>ImageAi</h1>
    <a href="#settings" class="gear" data-view="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </a>
  </header>

  <nav class="tabs">
    <a href="#create" class="tab" data-view="create">Create</a>
    <a href="#library" class="tab" data-view="library">Library</a>
    <a href="#theme" class="tab" data-view="theme">Theme</a>
  </nav>

  <main id="view-create" class="view view-create">
    <form id="make" class="card" novalidate>
      <div class="field">
        <label class="label" for="theme-name">Theme</label>
        <div class="combo">
          <input id="theme-name" type="text" role="combobox" aria-expanded="false"
                 aria-controls="theme-options" aria-autocomplete="list"
                 autocomplete="off" autocapitalize="off" spellcheck="false"
                 placeholder="Loading themes…" disabled>
          <button id="theme-toggle" type="button" class="combo-toggle" tabindex="-1"
                  aria-label="Show all themes">▾</button>
          <ul id="theme-options" class="combo-list" role="listbox" hidden></ul>
        </div>
        <p id="theme-hint" class="hint-line"></p>
      </div>

      <label class="field">
        <span class="label">Prompt</span>
        <textarea id="prompt" rows="4" placeholder="A goblin merchant with a big backpack"></textarea>
        <span id="prompt-error" class="error-line" hidden>Type a prompt first: describe the picture you want.</span>
      </label>

      <label class="field">
        <span class="label">Character name <span class="optional">(optional)</span></span>
        <input id="character" class="text-input" type="text" placeholder="Grim the goblin"
               autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="60">
        <span id="character-error" class="error-line" hidden></span>
      </label>

      <button id="generate" type="submit" class="primary">Generate</button>
    </form>

    <section class="card result" aria-live="polite">
      <h2>Result</h2>
      <div id="result" class="result-box">
        <p class="muted">Your picture will show up here.</p>
      </div>
    </section>
  </main>

  <main id="view-library" class="view" hidden>
    <section class="card">
      <h2>Library</h2>
      <div id="library-list" class="library-grid">
        <p class="muted">Loading…</p>
      </div>
    </section>
  </main>

  <main id="view-theme" class="view" hidden>
    <div id="theme-info" class="theme-info">
      <p class="muted">Loading…</p>
    </div>
  </main>

  <main id="view-settings" class="view" hidden>
    <section class="card">
      <h2>Settings</h2>
      <label class="switch-row">
        <span>
          <strong>Use 3060 settings</strong>
          <span class="muted small">For the 12 GB RTX 3060 on the Linux PC: uses less graphics memory. Leave off on the Mac.</span>
        </span>
        <input id="use-3060" type="checkbox" role="switch" disabled>
      </label>
      <p id="settings-note" class="hint-line" aria-live="polite"></p>
      <p class="muted small">Pictures are made on: <span id="settings-device">…</span></p>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
