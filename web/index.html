<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16161d">
  <title>ImageAi</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <h1>ImageAi</h1>
  </header>

  <main>
    <form id="make" class="card" novalidate>
      <div class="field">
        <label class="label" for="theme">Theme</label>
        <div class="combo">
          <input id="theme" type="text" role="combobox" aria-expanded="false"
                 aria-controls="theme-options" aria-autocomplete="list"
                 autocomplete="off" autocapitalize="off" spellcheck="false"
                 placeholder="Loading themes…" disabled>
          <button id="theme-toggle" type="button" class="combo-toggle" tabindex="-1"
                  aria-label="Show all themes">▾</button>
          <ul id="theme-options" class="combo-list" role="listbox" hidden></ul>
        </div>
        <p id="theme-hint" class="hint-line"></p>
      </div>

      <label class="field">
        <span class="label">Prompt</span>
        <textarea id="prompt" rows="4" placeholder="A goblin merchant with a big backpack"></textarea>
        <span id="prompt-error" class="error-line" hidden>Type a prompt first: describe the picture you want.</span>
      </label>

      <button id="generate" type="submit" class="primary">Generate</button>
    </form>

    <section class="card result" aria-live="polite">
      <h2>Result</h2>
      <div id="result" class="result-box">
        <p class="muted">Your picture will show up here.</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
